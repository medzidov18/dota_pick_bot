[project]
name = "dota-pick-bot"
version = "1.0.0"
description = "Dota 2 Pick Advisor Telegram Bot"
authors = [
    { name = "Dota Coach", email = "bot@example.com" }
]
dependencies = [
    "aiogram>=3.2.0",
    "openai>=1.3.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.1",
]
requires-python = ">=3.8"

[project.scripts]
dota-bot = "bot:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]